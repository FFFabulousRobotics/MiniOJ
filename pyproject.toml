[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "minioj"
version = "0.4.0"
description = "Run configured exercise stages and emit feedback as Markdown."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
minioj = "minioj.cli:main"

[tool.setuptools.packages.find]
include = ["minioj*"]
